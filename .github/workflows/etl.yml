name: 데이터 갱신

# 수집(etl.build, SQLite) → 공개 사이트 DB 게시(etl.publish, Supabase Postgres)
# 필요한 저장소 Secrets: CENSUS_API_KEY, ESTAT_APP_ID, DATA_GO_KR_KEY, DART_API_KEY, EIA_API_KEY, DATABASE_URL (+ FINRA_API_CLIENT_ID/SECRET: 신용 탭 회사채 시장 집계)
on:
  schedule:
    - cron: "43 18 * * *" # 매일 03:43 KST 예약 — GitHub 예약 실행은 보통 1~4시간 늦게 시작해 아침에 게시됨
    - cron: "17 21 * * *" # 06:17 KST 예비 — 첫 예약이 밀리거나(11/3 6시간 지연) 실패해도 아침 안에 갱신. 이미 갱신됐으면 아래 check가 건너뜀
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/curation.json", "data/plants.json", "data/hs_names_ko.json", "etl/**", "requirements.txt"] # 큐레이션·수집 코드 변경 시 바로 반영

concurrency:
  group: etl
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  # 예약 실행만: 최근 8시간 안에 성공한 갱신이 있으면 건너뜀 (예약 두 개 중 먼저 돈 쪽만 실제 수집)
  check:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.c.outputs.run }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          since=$(date -u -d '8 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh run list -R "${{ github.repository }}" -w etl.yml --status success --created ">=$since" --json databaseId --jq "[.[] | select(.databaseId != ${{ github.run_id }})] | length")
          echo "최근 8시간 성공 실행: $n"
          if [ "$n" -gt 0 ]; then echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi

  etl:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # 이전 실행의 DB와 바뀌지 않는 원본 캐시(DART XBRL, 관세청 과거 구간, 급등 탐지 월별 캐시, 랜섬웨어 월별)를 이어 쓴다.
      # DB를 이어 쓰므로 어떤 소스가 일시적으로 실패해도 그 시리즈는 이전 데이터가 유지된다.
      # Census·e-Stat·SEC는 캐시하지 않음 → 매번 최신 월을 새로 받음.
      - uses: actions/cache/restore@v4
        with:
          path: |
            data/yomin.db
            data/raw/dart
            data/raw/kcs
            data/raw/surge
            data/raw/ransomware
          key: etl-${{ github.run_id }}
          restore-keys: etl-

      - name: 수집
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          FINRA_API_CLIENT_ID: ${{ secrets.FINRA_API_CLIENT_ID }}
          FINRA_API_CLIENT_SECRET: ${{ secrets.FINRA_API_CLIENT_SECRET }}
        run: |
          set -o pipefail
          python -m etl.build | tee etl.log

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            data/yomin.db
            data/raw/dart
            data/raw/kcs
            data/raw/surge
            data/raw/ransomware
          key: etl-${{ github.run_id }}

      - name: 게시
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m etl.publish

      - name: 실패한 시리즈 요약
        if: always()
        run: |
          grep "✗" etl.log >> "$GITHUB_STEP_SUMMARY" || echo "실패한 시리즈 없음" >> "$GITHUB_STEP_SUMMARY"
